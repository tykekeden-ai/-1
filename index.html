<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>多機能時計フル版（全世界対応）</title>
<style>
body { font-family:sans-serif; text-align:center; background:#f0f0f0; margin:0; padding:20px; }
h1 { margin-bottom:10px; }
.clock-section, .function-section { margin-bottom:30px; }
#analogClock { width:200px; height:200px; background:white; border-radius:50%; border:4px solid #333; margin:0 auto 10px; position:relative; }
.hand { position:absolute; width:50%; height:2px; background:#333; top:50%; transform-origin:100%; transform:rotate(90deg); }
#hour { height:4px; background:#333; }
#minute { height:3px; background:#555; }
#second { height:2px; background:red; }
#digitalClock { font-size:2em; margin-bottom:10px; }
#worldClockContainer div { margin:3px 0; }
.functions { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
.section { background:white; padding:15px; border-radius:10px; box-shadow:1px 1px 5px rgba(0,0,0,0.2); min-width:180px; }
button { margin:5px; padding:8px 15px; }
#lapTimes { max-height:100px; overflow-y:auto; text-align:left; margin-top:5px; font-size:0.9em; }
</style>
</head>
<body>

<h1>🕒 多機能時計フル版</h1>

<div class="clock-section">
  <div id="analogClock">
    <div id="hour" class="hand"></div>
    <div id="minute" class="hand"></div>
    <div id="second" class="hand"></div>
  </div>
  <div id="digitalClock">--:--:--</div>

  <h3>世界時計（都市名＋タイムゾーン入力で追加）</h3>
  <div id="worldClockContainer"></div>
  <input type="text" id="cityName" placeholder="都市名">
  <input type="text" id="timeZone" placeholder="例: Asia/Tokyo">
  <button onclick="addWorldClock()">➕追加</button>
</div>

<div class="function-section functions">

  <div class="section">
    <h3>ストップウォッチ</h3>
    <div id="stopwatch">00:00.0</div>
    <button onclick="startStopwatch()">▶開始</button>
    <button onclick="stopStopwatch()">⏸停止</button>
    <button onclick="resetStopwatch()">🔄リセット</button>
    <button onclick="lapStopwatch()">🏁ラップ</button>
    <div id="lapTimes"></div>
  </div>

  <div class="section">
    <h3>タイマー</h3>
    <input type="number" id="timerMinutes" value="1" min="1"> 分
    <button onclick="startTimer()">▶開始</button>
    <div id="timerDisplay">00:00</div>
  </div>

  <div class="section">
    <h3>アラーム</h3>
    <input type="time" id="alarmTime">
    <button onclick="setAlarm()">⏰セット</button>
    <div id="alarmStatus">未設定</div>
  </div>

  <div class="section">
    <h3>天気情報</h3>
    <input type="text" id="weatherCity" placeholder="都市名" value="Tokyo">
    <button onclick="getWeather()">🌤️取得</button>
    <div id="weather">--</div>
  </div>

</div>

<audio id="beep">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
const API_KEY = "bb6ff605af6210f81b7d80ebd595b1f0";
let ntpOffset = 0;
let worldClocks = [];

function updateClock() {
  let now = new Date(Date.now()+ntpOffset);
  document.getElementById("digitalClock").textContent = now.toLocaleTimeString();
  let hours = now.getHours()%12, minutes=now.getMinutes(), seconds=now.getSeconds();
  document.getElementById("hour").style.transform=\`rotate(\${hours*30+minutes/2}deg)\`;
  document.getElementById("minute").style.transform=\`rotate(\${minutes*6}deg)\`;
  document.getElementById("second").style.transform=\`rotate(\${seconds*6}deg)\`;

  worldClocks.forEach(c=>{
    const time = now.toLocaleTimeString("en-US",{timeZone:c.zone});
    c.div.textContent = \`\${c.name}: \${time}\`;
  });
}
setInterval(updateClock,1000);

function addWorldClock(){
  const name=document.getElementById("cityName").value.trim();
  const zone=document.getElementById("timeZone").value.trim();
  if(!name||!zone){ alert("都市名とタイムゾーンを入力"); return; }
  const div=document.createElement("div");
  document.getElementById("worldClockContainer").appendChild(div);
  worldClocks.push({name,zone,div});
  document.getElementById("cityName").value="";
  document.getElementById("timeZone").value="";
}

let swInterval, swStart, swElapsed=0;
function startStopwatch(){ if(swInterval) return; swStart=Date.now()-swElapsed; swInterval=setInterval(()=>{ swElapsed=Date.now()-swStart; let s=(swElapsed/1000).toFixed(1); let m=Math.floor(s/60); document.getElementById("stopwatch").textContent=String(m).padStart(2,"0")+":"+String((s%60).toFixed(1)).padStart(4,"0"); },100);}
function stopStopwatch(){ clearInterval(swInterval); swInterval=null; }
function resetStopwatch(){ stopStopwatch(); swElapsed=0; document.getElementById("stopwatch").textContent="00:00.0"; document.getElementById("lapTimes").innerHTML=""; }
function lapStopwatch(){ let lap=document.getElementById("stopwatch").textContent; let lapDiv=document.createElement("div"); lapDiv.textContent=lap; document.getElementById("lapTimes").appendChild(lapDiv); }

let timerInterval, timerRemaining;
function startTimer(){ clearInterval(timerInterval); let minutes=parseInt(document.getElementById("timerMinutes").value); timerRemaining=minutes*60; timerInterval=setInterval(()=>{ timerRemaining--; let m=Math.floor(timerRemaining/60); let s=timerRemaining%60; document.getElementById("timerDisplay").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); if(timerRemaining<=0){ clearInterval(timerInterval); document.getElementById("beep").play(); alert("タイマー終了！"); } },1000); }

let alarms=[];
function setAlarm(){ let input=document.getElementById("alarmTime").value; if(!input){alert("時間を設定してください"); return;} alarms.push(input); document.getElementById("alarmStatus").textContent="設定: "+alarms.join(", "); }
setInterval(()=>{ if(alarms.length>0){ let now=new Date(Date.now()+ntpOffset); let h=String(now.getHours()).padStart(2,"0"); let m=String(now.getMinutes()).padStart(2,"0"); alarms=alarms.filter(a=>{ if(\`\${h}:\${m}\`===a){ document.getElementById("beep").play(); alert("アラーム！ "+a); return false; } return true; }); document.getElementById("alarmStatus").textContent=alarms.length>0?"設定: "+alarms.join(", "):"未設定"; } },1000);

async function getWeather(){
  const city=document.getElementById("weatherCity").value;
  try{
    const geoRes=await fetch(\`https://api.openweathermap.org/geo/1.0/direct?q=\${city}&limit=1&appid=\${API_KEY}\`);
    const geoData=await geoRes.json();
    if(!geoData[0]){ document.getElementById("weather").textContent="都市が見つかりません"; return; }
    const lat=geoData[0].lat, lon=geoData[0].lon;
    const weatherRes=await fetch(\`https://api.openweathermap.org/data/2.5/weather?lat=\${lat}&lon=\${lon}&appid=\${API_KEY}&units=metric&lang=ja\`);
    const weatherData=await weatherRes.json();
    document.getElementById("weather").textContent=\`\${weatherData.name}: \${weatherData.weather[0].description}, \${weatherData.main.temp}℃\`;
  }catch(e){ document.getElementById("weather").textContent="取得失敗"; }
}
</script>
</body>
</html>
